services:
  cmo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bhiv/cmo-agent-api:2.0.0
    container_name: cmo-agent-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_AUTH_ENABLED=true
      - AUTH_STRICT_RS256=false
      - MASTERDB_URL=http://masterdb:8000
      - MASTERDB_APP_ID=CMO_AGENT
      - MASTERDB_CAPABILITY_ID=cap-cmo-marketing-intelligence
      - RAG_LOG_FILE=/app/logs/cmo_service.log
    volumes:
      - cmo_records:/app/data/workflow_records
      - cmo_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cmo-net

  # Local MASTERDB capability testbed service (mock container)
  masterdb:
    image: python:3.11-slim
    container_name: cmo-masterdb-mock
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      python -c "
      import http.server, socketserver, json

      class Handler(http.server.SimpleHTTPRequestHandler):
          def do_GET(self):
              if self.path in ('/health', '/ready'):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"ok\",\"service\":\"MASTERDB\",\"version\":\"1.3.0\"}')
              elif 'cap-cmo-marketing-intelligence' in self.path:
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"capability_id\":\"cap-cmo-marketing-intelligence\",\"status\":\"READY\"}')
              else:
                  self.send_response(404)
                  self.end_headers()

          def do_POST(self):
              if self.path == '/access/request':
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"request_id\":\"req-mock-001\",\"access_token\":\"grant-mock-token\",\"authorized\":true}')
              elif 'retrieve' in self.path:
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"data\":{\"dataset_id\":\"ds-cmo-marketing-001\",\"records\":[]},\"content_digest_sha256\":\"mock_sha256\"}')
              elif '/pravah/events' in self.path:
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"COMMITTED\",\"event_id\":\"evt-001\"}')
              else:
                  self.send_response(200)
                  self.end_headers()

      with socketserver.TCPServer(('0.0.0.0', 8000), Handler) as httpd:
          print('MASTERDB capability mock listening on port 8000...')
          httpd.serve_forever()
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - cmo-net

volumes:
  cmo_records:
    driver: local
  cmo_logs:
    driver: local

networks:
  cmo-net:
    driver: bridge
